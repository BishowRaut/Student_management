{% extends "studentapp/home.html" %}

{% block title %}
Add Student | Student Management System
{% endblock %}


{% block content %}

<div class="page-header">

    <h1>
        Add Student
    </h1>

</div>


<div class="card">

    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>
                Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter student name"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Age
            </label>

            <input
                type="number"
                name="age"
                placeholder="Enter age"
                min="1"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Address
            </label>

            <input
                type="text"
                name="address"
                placeholder="Enter address"
                required
            >

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-success"
            >
                Save Student
            </button>

            <a
                href="{% url 'student_list' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
