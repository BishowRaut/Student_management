{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Student Management System</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>
                Student Management System
            </h1>

            <h2>
                Create Account
            </h2>

            {% if messages %}

                {% for message in messages %}

                    <div class="login-error">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Create Account
                </button>

            </form>


            <p class="register-link">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </p>

        </div>

    </div>

</body>

</html>
