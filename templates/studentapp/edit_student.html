{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            <a href="{% url 'home' %}">
                Student Management
            </a>
        </div>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'student_list' %}">Students</a>
            <a href="{% url 'add_student' %}">Add Student</a>
        </div>

    </nav>


    <!-- Edit Student Form -->
    <div class="form-page">

        <div class="form-card">

            <h1>Edit Student</h1>

            <p>Update student information</p>


            <form method="POST">

                {% csrf_token %}

                <!-- Student Name -->
                <div class="form-group">

                    <label for="name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ student.name }}"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <!-- Age -->
                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        value="{{ student.age }}"
                        placeholder="Enter age"
                        min="1"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ student.email }}"
                        placeholder="Enter email"
                        required
                    >

                </div>


                <!-- Address -->
                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        value="{{ student.address }}"
                        placeholder="Enter address"
                        required
                    >

                </div>


                <!-- Update Button -->
                <button
                    type="submit"
                    class="submit-btn"
                >
                    Update Student
                </button>

            </form>


            <!-- Back Link -->
            <div class="back-link">

                <a href="{% url 'student_list' %}">
                    ← Back to Students
                </a>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="footer">

        <p>
            Student Management System
        </p>

    </footer>
<script src="{% static 'js/script.js' %}"></script>
</body>

</html>
